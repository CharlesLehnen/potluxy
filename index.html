<html><head><base href="https://potlucky.com" />
<title>Potlucky - Easy Potluck Planning</title>
<style>
  body {
    font-family: Arial, sans-serif;
    line-height: 1.6;
    color: #333;
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    background-color: #f4f4f4;
  }
  h1, h2, h3 {
    color: #2c3e50;
    text-align: center;
  }
  form, #eventDetails {
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }
  label {
    display: block;
    margin-top: 10px;
  }
  input[type="text"], input[type="number"], input[type="password"] {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ddd;
    border-radius: 4px;
  }
  button {
    background-color: #3498db;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 20px;
  }
  button:hover {
    background-color: #2980b9;
  }
  #itemList, #commitList, #commitmentSummary {
    margin-top: 20px;
  }
  .item {
    background: white;
    margin-bottom: 10px;
    padding: 10px;
    border-radius: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .remove {
    color: #e74c3c;
    cursor: pointer;
  }
  .commitment {
    background: #ecf0f1;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 4px;
  }
  .error {
    color: #e74c3c;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <h1>Potlucky</h1>
  <div id="app"></div>

  <script>
    let items = [];
    let currentEvent = null;
    let currentUser = null;

    function renderCreateEventForm() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <form id="eventForm">
          <h2>Create New Event</h2>
          <label for="eventName">Event Name:</label>
          <input type="text" id="eventName" required>
          
          <label for="itemName">Item Name:</label>
          <input type="text" id="itemName">
          
          <label for="itemQuantity">Quantity Needed:</label>
          <input type="number" id="itemQuantity" min="1">
          
          <button type="button" onclick="addItem()">Add Item</button>
          
          <div id="itemList"></div>
          
          <button type="submit">Create Event</button>
        </form>
      `;

      document.getElementById('eventForm').addEventListener('submit', createEvent);
    }

    function addItem() {
      const itemName = document.getElementById('itemName').value;
      const itemQuantity = document.getElementById('itemQuantity').value;
      
      if (itemName && itemQuantity) {
        items.push({ name: itemName, quantity: parseInt(itemQuantity), committed: 0 });
        updateItemList();
        document.getElementById('itemName').value = '';
        document.getElementById('itemQuantity').value = '';
      }
    }

    function updateItemList() {
      const itemList = document.getElementById('itemList');
      itemList.innerHTML = '';
      items.forEach((item, index) => {
        const itemElement = document.createElement('div');
        itemElement.className = 'item';
        itemElement.innerHTML = `
          <span>${item.name} (${item.quantity})</span>
          <span class="remove" onclick="removeItem(${index})">✖</span>
        `;
        itemList.appendChild(itemElement);
      });
    }

    function removeItem(index) {
      items.splice(index, 1);
      updateItemList();
    }

    function createEvent(e) {
      e.preventDefault();
      const eventName = document.getElementById('eventName').value;
      if (eventName && items.length > 0) {
        const eventId = Date.now().toString(36) + Math.random().toString(36).substr(2);
        const eventData = { name: eventName, items: items, userCommits: [] };
        localStorage.setItem(eventId, JSON.stringify(eventData));
        alert(`Event created! Share this link with your friends:\n${location.origin}/event/${eventId}`);
        window.history.pushState({}, '', `/event/${eventId}`);
        loadEvent(eventId);
      } else {
        alert('Please enter an event name and add at least one item.');
      }
    }

    function loadEvent(eventId) {
      const eventData = JSON.parse(localStorage.getItem(eventId));
      if (eventData) {
        currentEvent = { id: eventId, ...eventData };
        renderEventDetails();
      } else {
        alert('Event not found');
        renderCreateEventForm();
      }
    }

    function renderEventDetails() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div id="eventDetails">
          <h2>${currentEvent.name}</h2>
          <div id="commitmentSummary"></div>
          <form id="loginForm">
            <h3>Login or Sign Up</h3>
            <label for="username">Your Name:</label>
            <input type="text" id="username" required>
            
            <label for="password">Password (optional):</label>
            <input type="password" id="password">
            
            <button type="submit">Login / Sign Up</button>
          </form>
          <div id="errorMessage" class="error"></div>
          <div id="commitFormContainer" style="display: none;">
            <form id="commitForm">
              <h3>Commit to Bringing Items</h3>
              <div id="commitList"></div>
              <button type="submit">Commit to Bring Items</button>
            </form>
          </div>
        </div>
      `;

      updateCommitmentSummary();
      document.getElementById('loginForm').addEventListener('submit', handleLogin);
    }

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      const existingUser = currentEvent.userCommits.find(user => user.username === username);
      
      if (existingUser) {
        if (existingUser.password && existingUser.password !== password) {
          document.getElementById('errorMessage').textContent = 'Incorrect password. Please try again.';
          return;
        }
        currentUser = existingUser;
      } else {
        currentUser = { username, password, commits: [] };
        currentEvent.userCommits.push(currentUser);
      }

      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('errorMessage').textContent = '';
      document.getElementById('commitFormContainer').style.display = 'block';
      renderCommitForm();
    }

    function renderCommitForm() {
      const commitList = document.getElementById('commitList');
      commitList.innerHTML = '';
      currentEvent.items.forEach((item, index) => {
        const userCommitment = currentUser.commits.find(commit => commit.itemIndex === index);
        const currentCommitment = userCommitment ? userCommitment.quantity : 0;
        const remainingNeeded = item.quantity - (item.committed - currentCommitment);

        const itemElement = document.createElement('div');
        itemElement.className = 'item';
        itemElement.innerHTML = `
          <span>${item.name} (${remainingNeeded} needed)</span>
          <input type="number" id="commit-${index}" min="0" max="${remainingNeeded}" value="${currentCommitment}">
        `;
        commitList.appendChild(itemElement);
      });

      document.getElementById('commitForm').addEventListener('submit', commitItems);
    }

    function updateCommitmentSummary() {
      const summary = document.getElementById('commitmentSummary');
      summary.innerHTML = '<h3>Current Commitments</h3>';
      
      if (currentEvent.userCommits.length === 0) {
        summary.innerHTML += '<p>No commitments yet.</p>';
        return;
      }

      currentEvent.userCommits.forEach(userCommit => {
        const commitElement = document.createElement('div');
        commitElement.className = 'commitment';
        let commitText = `<strong>${userCommit.username}</strong> is bringing:<br>`;
        userCommit.commits.forEach(commit => {
          const item = currentEvent.items[commit.itemIndex];
          commitText += `- ${commit.quantity} ${item.name}<br>`;
        });
        commitElement.innerHTML = commitText;
        summary.appendChild(commitElement);
      });
    }

    function commitItems(e) {
      e.preventDefault();
      const newCommits = currentEvent.items.map((item, index) => ({
        itemIndex: index,
        quantity: parseInt(document.getElementById(`commit-${index}`).value) || 0
      })).filter(commit => commit.quantity > 0);

      if (newCommits.length === 0) {
        alert('Please commit to bringing at least one item.');
        return;
      }

      // Remove old commitments
      currentUser.commits.forEach(oldCommit => {
        currentEvent.items[oldCommit.itemIndex].committed -= oldCommit.quantity;
      });

      // Add new commitments
      newCommits.forEach(newCommit => {
        currentEvent.items[newCommit.itemIndex].committed += newCommit.quantity;
      });

      currentUser.commits = newCommits;

      localStorage.setItem(currentEvent.id, JSON.stringify(currentEvent));
      alert('Thank you for your commitment!');
      renderEventDetails();
    }

    // Initial render
    const path = window.location.pathname;
    if (path.startsWith('/event/')) {
      const eventId = path.split('/')[2];
      loadEvent(eventId);
    } else {
      renderCreateEventForm();
    }

    // Handle browser navigation
    window.onpopstate = function(event) {
      const path = window.location.pathname;
      if (path.startsWith('/event/')) {
        const eventId = path.split('/')[2];
        loadEvent(eventId);
      } else {
        renderCreateEventForm();
      }
    };
  </script>
</body></html>
