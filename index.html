<!DOCTYPE html>
<html>
<head>
  <title>Potluxy - Easy Potluck Planner</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"></script>
  <script type="module" src="config.js"></script>
  <link rel="stylesheet" href="style.css">

  <!-- Google Translate API -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        { pageLanguage: 'en', includedLanguages: 'es,fr,de,zh,hi,ar', layout: google.translate.TranslateElement.InlineLayout.SIMPLE },
        'google_translate_element'
      );
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <!-- Google Adsense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9283020036917902"
     crossorigin="anonymous"></script>

</head>
<body>
  <!-- Google Translate Widget -->
  <div id="google_translate_element" class="translate-widget"></div>


  <div id="formWrapper">
    <div class="logo">
      <h1>Potluxy&trade;</h1>
    </div>
    <div id="app">
      <form id="loginForm" class="form">
        <div class="form-item">
          <p class="formLabel">Username</p>
          <input type="text" id="username" class="form-style" autocomplete="off" required>
        </div>
        <div class="form-item">
          <p class="formLabel">Password</p>
          <input type="password" id="password" class="form-style" required>
        </div>
        <div class="form-item">
          <button type="submit" class="login">Log In</button>
        </div>
      </form>
    </div>
    <footer>&copy; 2025 Potluxy. All rights reserved.</footer>
  </div>

  <script type="module" src="main.js"></script>
  <script src="style.js"></script>
</body>
</html>
